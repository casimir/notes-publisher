name: Plugin CI

on:
    push:
        branches: ["**"]
        paths:
            - "obsidian/**"
            - ".github/workflows/plugin-ci.yml"
    pull_request:
        branches: ["**"]
        paths:
            - "obsidian/**"
            - ".github/workflows/plugin-ci.yml"

defaults:
    run:
        working-directory: obsidian

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: obsidian/package-lock.json
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test
